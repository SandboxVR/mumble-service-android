import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

def bouncyCastleVersion = '1.84'
def bouncyCastleAarLibsDir = file("$buildDir/generated/bouncycastle-aar-libs")
def bouncyCastleAarLibs = [
    [artifact: 'bcprov-jdk15to18', sha256: 'a30777eebbd44aa1713c14ee04547de1df63ef3e383e910ed210e1d0f2c2ef92'],
    [artifact: 'bcpkix-jdk15to18', sha256: 'c92c089b9cce6f889f5274ae3f762e87a9643bcc76493e044ac2f77b46cf8c0c'],
    [artifact: 'bcutil-jdk15to18', sha256: '480d4d20d49aee66f4b04679d10437d7a3c35435c4e6b5378ad2b831a82b94d5'],
]

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
    }
}
apply plugin: 'com.android.library'

repositories {
    mavenCentral()
    google()
}

dependencies {
    api 'com.google.protobuf:protobuf-java:3.11.4'
    api files(bouncyCastleAarLibs.collect { file("$bouncyCastleAarLibsDir/${it.artifact}-${bouncyCastleVersion}.jar") })

    implementation 'com.googlecode.javacpp:javacpp:0.7'
    implementation 'org.jetbrains:annotations:18.0.0'
    implementation 'org.minidns:minidns-hla:0.3.4'
    implementation 'org.minidns:minidns-android21:0.3.4'
    implementation 'com.google.guava:guava:28.2-android'
}

allprojects {
    tasks.withType(JavaCompile) {
        // TODO include deprecations at some point, but currently they are *many*
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann"
    }
}

task downloadBouncyCastleAarLibs {
    outputs.files(bouncyCastleAarLibs.collect { file("$bouncyCastleAarLibsDir/${it.artifact}-${bouncyCastleVersion}.jar") })

    doLast {
        bouncyCastleAarLibsDir.mkdirs()

        bouncyCastleAarLibs.each { dependency ->
            def jarFile = file("$bouncyCastleAarLibsDir/${dependency.artifact}-${bouncyCastleVersion}.jar")
            def url = "https://repo1.maven.org/maven2/org/bouncycastle/${dependency.artifact}/${bouncyCastleVersion}/${dependency.artifact}-${bouncyCastleVersion}.jar"

            if (!jarFile.exists() || sha256(jarFile) != dependency.sha256) {
                new URL(url).withInputStream { input ->
                    jarFile.withOutputStream { output ->
                        output << input
                    }
                }
            }

            def actualSha256 = sha256(jarFile)
            if (actualSha256 != dependency.sha256) {
                throw new GradleException("Checksum mismatch for ${jarFile.name}. Expected ${dependency.sha256}, got ${actualSha256}")
            }
        }
    }
}

static String sha256(File file) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

android {
    compileSdkVersion 29
    //ndkVersion '23.1.7779620'
    if (System.getenv('ANDROID_BUILD_TOOLS_VERSION')) {
        buildToolsVersion System.getenv('ANDROID_BUILD_TOOLS_VERSION')
    }

    sourceSets.main.jniLibs.srcDir 'src/main/libs/'
    sourceSets.main.jni.srcDirs = [] // Disable NDK build support until it supports multiple modules.

    defaultConfig {
        testApplicationId "se.lublin.humla.test"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        minSdkVersion 14
        targetSdkVersion 29

//        ndk {
//            abiFilters "armeabi", "armeabi-v7a", "x86"
//            stl "gnustl_static"
//            cFlags "-I\$(LOCAL_PATH)/speex/include/ -I\$(LOCAL_PATH)/opus/include -D__EMX__ -DUSE_KISS_FFT -DFIXED_POINT -DEXPORT='' -DHAVE_CONFIG_H -fvisibility=hidden -DOPUS_BUILD -DVAR_ARRAYS -Wno-traditional -DFIXED_POINT"
//        }
    }

    // Trigger NDK build on java compilation task.
    task ndkBuild(type: Exec) {
        def ndkExe = "$project.android.ndkDirectory/ndk-build"
        if (DefaultNativePlatform.getCurrentOperatingSystem().isWindows()) {
          ndkExe += '.cmd'
        }
        commandLine ndkExe, '-C', file('src/main/jni/').absolutePath
    }

    tasks.withType(JavaCompile) {
        compileTask -> compileTask.dependsOn ndkBuild, downloadBouncyCastleAarLibs
    }

    preBuild.dependsOn downloadBouncyCastleAarLibs

    lintOptions {
        quiet false

        disable "InvalidPackage"

        disable "MissingTranslation"

        ignoreWarnings false
        abortOnError true
    }
}
